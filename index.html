<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlutApp</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand__logo">GlutApp</div>
          <div class="brand__tagline">Sans gluten, partout</div>
        </div>
        <div class="search">
          <div class="searchBox">
            <input id="searchInput" type="search" placeholder="Rechercher un lieu ou un produit..." />
            <button id="searchButton" class="searchButton" type="button" aria-label="Rechercher">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M10.5 18.5a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z" stroke="currentColor" stroke-width="2" />
                <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </button>
          </div>
          <div id="searchSuggestions" class="suggestions" role="listbox" aria-label="Suggestions"></div>
        </div>
        <button id="toggleView" class="toggle" type="button">Voir la liste</button>
      </header>
      <main class="content">
        <section id="mapView" class="view view--active">
          <div id="map" class="map"></div>
        </section>

        <section id="listView" class="view">
          <div id="list" class="list"></div>
        </section>

        <section id="detailView" class="view">
          <div class="detail">
            <div class="detailTop">
              <button id="backButton" class="back" type="button">Retour</button>
            </div>
            <div id="detailCard" class="detailCard"></div>
            <div id="detailMap" class="detailMap"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="script.js"></script>
  </body>
</html>
